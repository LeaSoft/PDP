name: 🚀 PDP | Deployment & Security

on:
  push:
    branches: [ main ]
  # Pull requests run the tests only; nothing is built or deployed from them
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push to a pull request cancels its older run; on main a deploy that has
# started always finishes, and only the newest waiting one runs after it
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 🧪 App | PHPUnit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 📥 Repo | Checkout
        uses: actions/checkout@v5

      - name: 🐘 PHP | Set up 8.5 (as in the image)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, mbstring, pdo_sqlite, zip
          coverage: none

      - name: 📦 Composer | Find the cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: 📦 Composer | Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Advisories are Trivy's and Dependabot's job; a new one must not stop the tests
      - name: 📦 Composer | Install
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: "0"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🟢 Node | Set up 20 (as in the image)
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: 📦 npm | Install
        run: npm ci --no-audit --no-fund

      - name: 🔑 Laravel | Prepare .env and key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Pages render with @vite, so the suite needs the manifest; Wayfinder calls artisan here
      - name: 🎨 Assets | Build
        run: npm run build

      # phpunit.xml gives the suite SQLite in memory over the .env values
      - name: 🧪 PHPUnit | Run the suite
        run: vendor/bin/phpunit

  build:
    name: 🐳 Images | Build & push (${{ matrix.id }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        include:
          - id: php
            target: prod
            image: leasoft/pdp-php
            cache_scope: pdp-php
          - id: nginx
            target: nginx
            image: leasoft/pdp-nginx
            cache_scope: pdp-nginx

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Repo | Checkout
        uses: actions/checkout@v5

      - name: ⚙️ Docker | Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Registry | Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧱 Image | Build & push (${{ matrix.id }}) (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  trivy-scan:
    name: 🔍 Security | Trivy scan & upload SARIF
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: php
            image: leasoft/pdp-php
          - id: nginx
            image: leasoft/pdp-nginx

    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write

    steps:
      - name: 🔐 Registry | Log in to GHCR (read)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Security | Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          format: sarif
          output: trivy-${{ matrix.id }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: 📎 Security | Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.id }}.sarif

  deploy:
    name: 🚢 Prod | Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://pdp.leasoft.co

    steps:
      - name: 🔐 SSH | Deploy to PROD
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail

            echo "📂 Repo | Switch to project directory..."
            cd /pdp/PDP

            echo "🔄 Repo | Update from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔐 Registry | Log in to GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USER }} --password-stdin

            echo "🏷️ Image | Using tag from build..."
            export IMAGE_TAG="${{ github.sha }}"

            echo "📥 Compose | Pull latest images..."
            docker compose -f docker-compose.prod.yaml pull

            echo "🚀 Compose | Restart services..."
            docker compose -f docker-compose.prod.yaml up -d

            # Images are tagged per commit, so `prune` alone never removes them and they
            # pile up on the shared host. GHCR keeps the last 10 for a rollback.
            echo "🧹 Docker | Remove older PDP images..."
            for repo in ghcr.io/leasoft/pdp-php ghcr.io/leasoft/pdp-nginx; do
              docker images "$repo" --format '{{.Tag}}' \
                | grep -vx -e "$IMAGE_TAG" \
                | xargs -r -I{} docker rmi "$repo:{}" > /dev/null || true
            done
            docker image prune -f

            echo "✅ Prod | Deployment finished"

      # Green only once the new php container answers with this commit and a live database
      - name: 🩺 Health | Wait for this version on /api/health
        env:
          HEALTH_URL: https://pdp.leasoft.co/api/health
        run: |
          for attempt in $(seq 1 24); do
            body="$(curl -sS --max-time 10 "$HEALTH_URL" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"' \
              && printf '%s' "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "🩺 $body" >> "$GITHUB_STEP_SUMMARY"
              echo "✅ Prod | Healthy on ${GITHUB_SHA}"
              exit 0
            fi
            echo "⏳ Health | Attempt ${attempt}/24, not healthy on this commit yet"
            sleep 5
          done
          echo "❌ Prod | /api/health did not report ${GITHUB_SHA} as healthy: ${body}"
          exit 1

  cleanup:
    name: 🧹 Registry | Cleanup GHCR (keep last 10)
    runs-on: ubuntu-latest
    needs: build

    env:
      GH_TOKEN: ${{ github.token }}

    strategy:
      matrix:
        package: [pdp-php, pdp-nginx]

    steps:
      - name: 🔐 GH CLI | Auth
        run: gh auth setup-git

      - name: 🧹 Registry | Cleanup ${{ matrix.package }}
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "🧩 Package: $PACKAGE"

          gh api --paginate "/orgs/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
          | jq -r 'sort_by(.created_at) | reverse | .[].id' \
          | tail -n +11 \
          | xargs -r -I{} gh api --method DELETE "/orgs/$OWNER/packages/container/$PACKAGE/versions/{}"

          echo "✅ Cleanup finished for $PACKAGE"
